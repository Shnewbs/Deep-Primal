plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = 'com.shnewbs.deepprimal'
version = project.mod_version
base.archivesName = 'DeepPrimal-26.1.2'
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
sourceSets {
    coreChecks {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    visualValidation {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

neoForge {
    version = project.neo_version
    runs {
        client {
            client()
            if (project.hasProperty('visualValidation') && (project.hasProperty('captureServer') || project.hasProperty('captureWorld'))) {
                gameDirectory = project.file(findProperty('clientRunDir') ?: 'run-visual')
                if (project.hasProperty('captureServer')) programArguments.addAll '--quickPlayMultiplayer', project.property('captureServer')
                if (project.hasProperty('captureWorld')) programArguments.addAll '--quickPlaySingleplayer', project.property('captureWorld')
                systemProperty 'deepprimal.validationCapture', project.file('build/visual-validation').absolutePath
                if (project.hasProperty('distanceValidation')) systemProperty 'deepprimal.validationDistances', 'true'
                jvmArgument '-Xmx2G'
            }
        }
        server {
            server()
            programArgument '--nogui'
            gameDirectory = project.file(findProperty('runDir') ?: 'run')
            jvmArgument '-Xmx2G'
        }
    }
    mods {
        deepprimal {
            sourceSet(sourceSets.main)
            if (project.hasProperty('visualValidation')) sourceSet(sourceSets.visualValidation)
        }
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('jar') {
    manifest.attributes('Implementation-Version': project.version)
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.named('wrapper') { gradleVersion = '9.2.1'; distributionType = Wrapper.DistributionType.BIN }

tasks.register('verifyCoreBoundary') {
    inputs.files(fileTree('src/main/java/com/shnewbs/deepprimal/core'))
    doLast {
        inputs.files.each { f ->
            if (f.text.contains('net.minecraft') || f.text.contains('net.neoforged'))
                throw new GradleException("Platform dependency inside core: $f")
        }
    }
}
tasks.register('coreChecks', JavaExec) {
    dependsOn coreChecksClasses
    classpath = sourceSets.coreChecks.runtimeClasspath
    mainClass = 'com.shnewbs.deepprimal.core.CoreChecks'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}
tasks.named('check') { dependsOn 'coreChecks', 'verifyCoreBoundary' }
tasks.named('runServer') { standardInput = System.in }

processResources {
    inputs.property 'mod_version', project.mod_version
    filesMatching('META-INF/neoforge.mods.toml') { expand(mod_version: project.mod_version) }
}
