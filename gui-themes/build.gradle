plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
group = 'com.shnewbs.deepprimal'
version = project.mod_version
base.archivesName = 'DeepPrimal-Themes-26.1.2'
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
neoForge {
    version = project.neo_version
    runs { client { client(); gameDirectory = project.file('run') } }
    mods { deepprimal_themes { sourceSet(sourceSets.main) } }
}
sourceSets {
    themeAssets {
        java.srcDir 'src/main/java'
        java.include 'com/shnewbs/deepprimal/themes/Theme.java'
        java.include 'com/shnewbs/deepprimal/themes/assets/**'
    }
}
def generatedThemes = layout.buildDirectory.dir('generated/themeResources')
tasks.register('generateThemeAssets', JavaExec) {
    dependsOn 'themeAssetsClasses', 'createMinecraftArtifacts'
    classpath = sourceSets.themeAssets.runtimeClasspath
    mainClass = 'com.shnewbs.deepprimal.themes.assets.GenerateThemes'
    systemProperty 'java.awt.headless', 'true'
    inputs.files(sourceSets.themeAssets.allSource)
    inputs.files(tasks.named('createMinecraftArtifacts'))
    outputs.dir(generatedThemes)
    doFirst {
        delete(generatedThemes.get().asFile)
        args = [generatedThemes.get().asFile.absolutePath] + configurations.compileClasspath.files.collect { it.absolutePath }
    }
}
sourceSets.main.resources.srcDir generatedThemes
tasks.named('processResources') {
    // Keep interrupted-sync files out of the nested module and distributable bundle.
    exclude '**/.rsync-tmp/**', '**/.*'
    dependsOn 'generateThemeAssets'
    inputs.property 'mod_version', project.mod_version
    filesMatching('META-INF/neoforge.mods.toml') { expand(mod_version: project.mod_version) }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.incremental = false
}
tasks.named('jar') {
    exclude '**/.rsync-tmp/**', '**/.*'
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

// Opt-in client smoke harness. Its classes are never included in the release JAR.
if (providers.gradleProperty('themeValidation').isPresent()) {
    sourceSets {
        validation {
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
        }
    }
    neoForge.mods.deepprimal_themes.sourceSet(sourceSets.validation)
}

// Use the project's Java 25 toolchain for the asset downloader as well as the game.
tasks.withType(net.neoforged.nfrtgradle.NeoFormRuntimeTask).configureEach {
    javaExecutable = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    }.map { it.executablePath.asFile.absolutePath }
}

// Optional presence stub exercises the companion-without-provider HUD layout.
if (providers.gradleProperty('themeCompatValidation').isPresent()) {
    sourceSets {
        compatValidation {
            compileClasspath += sourceSets.main.compileClasspath
            runtimeClasspath += sourceSets.main.runtimeClasspath
        }
    }
    neoForge.mods { deepprimal { sourceSet(sourceSets.compatValidation) } }
}
