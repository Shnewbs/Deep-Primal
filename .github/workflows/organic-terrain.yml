name: Organic terrain qualification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/organic-terrain.yml'
      - 'engine-core/src/main/java/com/shnewbs/deepprimal/core/OrganicDrainage.java'
      - 'engine-core/src/main/java/com/shnewbs/deepprimal/core/WatershedRegion.java'
      - 'src/coreChecks/**/OrganicDrainage*'
      - 'src/visualValidation/**/WorldCreationChecks.java'
      - 'src/visualValidation/**/EngineSceneChecks.java'
      - 'tools/organic-native.init.gradle'
      - 'tools/publish_organic_qualification.py'
permissions:
  contents: write
  actions: read
concurrency:
  group: organic-terrain-main
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      ALSOFT_DRIVERS: 'null'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Resolve unchanged-engine check receipt
        id: checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          base='5b528ff5e707e5f56cdab4e58e7dd12740f66f09'
          run_id=42265994875
          def api(path):
              return json.loads(subprocess.run(['gh','api',path],check=True,text=True,capture_output=True).stdout)
          allowed={'.github/workflows/organic-terrain.yml','.github/workflows/accept-organic-terrain.yml',
                   'tools/organic-native.init.gradle','tools/publish_organic_qualification.py',
                   'tools/accept_organic_qualification.py','docs/ORGANIC-DRAINAGE.md'}
          reuse=False
          try:
              repo=os.environ['GITHUB_REPOSITORY']
              previous=api(f'repos/{repo}/actions/runs/{run_id}')
              jobs=api(f'repos/{repo}/actions/runs/{run_id}/jobs')['jobs']
              compared=api(f'repos/{repo}/compare/{base}...{os.environ["GITHUB_SHA"]}')
              full_pass=any(s['name']=='Build and run complete checks' and s['conclusion']=='success'
                            for j in jobs for s in j['steps'])
              reuse=(previous['head_sha']==base and full_pass and compared['behind_by']==0
                     and len(compared['files'])<300
                     and all(f['filename'] in allowed for f in compared['files']))
          except Exception as error:
              print('Full checks required; no reusable receipt:',type(error).__name__)
          task='assemble' if reuse else 'build'
          with open(os.environ['GITHUB_OUTPUT'],'a') as output: output.write('task='+task+'\n')
          Path('build').mkdir(exist_ok=True)
          Path('build/full-check-receipt.json').write_text(json.dumps(
              {'reused':reuse,'full_check_commit':base if reuse else os.environ['GITHUB_SHA'],
               'full_check_run':run_id if reuse else int(os.environ['GITHUB_RUN_ID'])}))
          print('ENGINE_CHECK_RECEIPT',task,'unchanged-engine-reuse=',reuse)
          PY
      - name: Build with verified engine check receipt
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -PvulkanPlatform=linux ${{ steps.checks.outputs.task }}
      - name: Prepare native capture
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri mesa-utils libflite1 flite1-dev
          mkdir -p run-organic
          printf 'onboardAccessibility:false\nrenderDistance:8\nsimulationDistance:6\nmaxFps:60\nenableVsync:false\n' > run-organic/options.txt
      - name: Create and inspect an actual engine world
        timeout-minutes: 18
        run: |
          set -o pipefail
          xvfb-run -a -s '-screen 0 1280x900x24' ./gradlew --no-daemon \
            -I tools/organic-native.init.gradle -PvulkanPlatform=linux \
            -PvisualValidation -PworldCreationValidation \
            -PcreationName=Organic-Native -PclientRunDir=run-organic \
            -PcaptureDir=build/organic-native -PgraphicsBackend=OpenGL :runClient | tee build/organic-native-client.log
          python - <<'PY'
          from pathlib import Path
          import re
          log=Path('build/organic-native-client.log').read_text()
          assert 'ORGANIC_NATIVE_WORLD_PASS channelRevision=10 ownedBiomes=40' in log
          assert 'INTEGRATED_CLIENT_PASS scenes=coast,headwater,river,lake,outlet,ridge' in log
          for failure in ['Encountered an unexpected exception', 'This crash report has been saved',
                          'Preparing crash report', 'Error executing task on Client',
                          'Error stopping the server', 'Failed to save', 'Exception in thread']:
              assert failure not in log, failure
          assert not re.search(r'\[(?:Render thread|Server thread)/(?:ERROR|FATAL)\]',log), 'Native render/server error'
          capture=log.index('INTEGRATED_CLIENT_PASS scenes=')
          saved=log.index('ThreadedAnvilChunkStorage: All dimensions are saved',capture)
          stopped=log.index('[minecraft/Minecraft]: Stopping!',saved)
          assert log.index('BUILD SUCCESSFUL',stopped)>stopped
          print('NATIVE_CAPTURE_FILES',[str(p) for p in Path('build/organic-native').rglob('*.png')])
          for name in ['coast','headwater','river','lake','outlet','ridge']:
              assert (Path('build/organic-native/screenshots')/f'scene-{name}.png').is_file(), name
          PY
      - name: Assemble Windows Vulkan package
        run: |
          ./gradlew --no-daemon -PvulkanPlatform=windows assemble
          python - <<'PY'
          from pathlib import Path
          import io,json,zipfile
          package=next(Path('build/libs').glob('*vulkan-windows.jar'))
          with zipfile.ZipFile(package) as root:
              metadata=json.loads(root.read('META-INF/jarjar/metadata.json'))
              jars={entry['path'] for entry in metadata['jars']}
              assert jars=={n for n in root.namelist() if n.startswith('META-INF/jarjar/') and n.endswith('.jar')}
              renderer=[p for p in jars if 'Vulkan' in p]
              assert len(renderer)==1, renderer
              with zipfile.ZipFile(io.BytesIO(root.read(renderer[0]))) as vulkan:
                  dlls=[n.lower() for n in vulkan.namelist() if n.lower().endswith('.dll')]
                  assert any('shaderc' in n for n in dlls), 'Missing Windows shaderc native'
                  assert any('vma' in n for n in dlls), 'Missing Windows VMA native'
          print('WINDOWS_VULKAN_PACKAGE_PASS',package)
          PY
      - name: Preserve package and proof for visual review
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/publish_organic_qualification.py
