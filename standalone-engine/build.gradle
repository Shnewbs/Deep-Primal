plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
group = 'com.shnewbs.primalengine'
version = project.engine_version
base.archivesName = 'PrimalEngine-26.1.2'
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
evaluationDependsOn(':lod-core')
dependencies { implementation(project(':lod-core')); jarJar(project(':lod-core')) }
sourceSets {
    engineChecks {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    nativeChecks {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
neoForge {
    version = '26.1.2.122'
    runs {
        client {
            client()
            gameDirectory = project.file(findProperty('runDir') ?: 'run-client')
            if (project.hasProperty('captureWorld')) programArguments.addAll '--quickPlaySingleplayer', project.property('captureWorld')
            if (project.hasProperty('captureDir')) systemProperty 'primalengine.capture', project.file(project.property('captureDir')).absolutePath
        }
        server {
            server()
            programArgument '--nogui'
            gameDirectory = project.file(findProperty('runDir') ?: 'run-server')
        }
    }
    mods {
        primalengine {
            sourceSet(sourceSets.main)
            if (project.hasProperty('nativeChecks')) sourceSet(sourceSets.nativeChecks)
        }
    }
}
neoForge.mods { primalengine_lod { sourceSet(project(':lod-core').sourceSets.main) } }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
processResources {
    inputs.property 'engine_version', project.engine_version
    filesMatching('META-INF/neoforge.mods.toml') { expand(engine_version: project.engine_version) }
}
tasks.named('jar') { preserveFileTimestamps = false; reproducibleFileOrder = true }
tasks.register('engineChecks', JavaExec) {
    dependsOn engineChecksClasses
    classpath = sourceSets.engineChecks.runtimeClasspath
    mainClass = 'com.shnewbs.primalengine.checks.EngineChecks'
}
tasks.register('verifyIndependentCore') {
    doLast {
        fileTree('src/main/java/com/shnewbs/primalengine/core').matching { include '**/*.java' }.each {
            if (it.text.contains('net.minecraft') || it.text.contains('net.neoforged') || it.text.contains('com.shnewbs.deepprimal'))
                throw new GradleException('Platform dependency inside engine core: ' + it)
        }
        fileTree('src/main/java').matching { include '**/*.java' }.each {
            if (it.text.contains('NoiseBasedChunkGenerator') || it.text.contains('minecraft:overworld/continents') || it.text.contains('com.shnewbs.deepprimal'))
                throw new GradleException('Legacy terrain dependency: ' + it)
        }
    }
}
tasks.named('check') { dependsOn 'engineChecks', 'verifyIndependentCore' }
if (project.hasProperty('packagedChecks')) {
    ['runServer', 'runClient'].each { n -> tasks.named(n, JavaExec) {
        dependsOn jar
        doFirst {
            String paths = 'primalengine%%' + tasks.jar.archiveFile.get().asFile.absolutePath
            if (project.hasProperty('nativeChecks')) paths += File.pathSeparator + 'primalengine%%' + sourceSets.nativeChecks.output.classesDirs.singleFile.absolutePath
            environment 'MOD_CLASSES', paths
        }
    } }
}
