plugins { id 'java-library' }
group = 'com.shnewbs.primalengine'
version = rootProject.engine_version
base.archivesName = 'PrimalEngine-LOD-Core'
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
tasks.named('jar') {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    manifest.attributes('FMLModType':'LIBRARY', 'Automatic-Module-Name':'com.shnewbs.primalengine.lod')
}
