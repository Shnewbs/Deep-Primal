allprojects { tasks.withType(JavaCompile).configureEach { options.incremental = false; outputs.upToDateWhen { false } } }
gradle.projectsEvaluated {
 gradle.rootProject.allprojects { p ->
  p.tasks.matching { it.name == "createMinecraftArtifacts" }.configureEach { t ->
   t.enableCache.set(false)
   t.verbose.set(true)
   t.doFirst {
    t.logger.lifecycle("PRIVATE_NFRT_CACHE_ENABLED=" + t.enableCache.get())
    if(t.enableCache.get()) throw new GradleException("Private diagnostic cache-disable setting was overwritten")
   }
  }
 }
}
