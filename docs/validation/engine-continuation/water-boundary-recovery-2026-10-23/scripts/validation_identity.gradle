gradle.projectsEvaluated {
 def p=gradle.rootProject
 def src=p.file('src/visualValidation/java/com/shnewbs/deepprimal/validation/WaterAdmissionPlanChecks.java')
 def cls=p.file('build/classes/java/visualValidation/com/shnewbs/deepprimal/validation/WaterAdmissionPlanChecks.class')
 def sha={f->java.security.MessageDigest.getInstance('SHA-256').digest(f.bytes).encodeHex().toString()}
 p.tasks.named('compileVisualValidationJava') {
  outputs.upToDateWhen { false }
  outputs.cacheIf { false }
  options.incremental = false
  doFirst { println 'ADMISSION_SOURCE_BEFORE_COMPILER '+sha(src)+' '+src.absolutePath }
  doLast {
   println 'ADMISSION_CLASS_AFTER_COMPILER '+sha(cls)
   if(!new String(cls.bytes,java.nio.charset.StandardCharsets.ISO_8859_1).contains('farAndBusyGeometryFromRealMesher'))throw new GradleException('Admission fixture marker missing immediately after compiler')
  }
 }
 p.tasks.named('runClient') { doFirst {
  println 'ADMISSION_CLASS_BEFORE_NATIVE '+sha(cls)
  if(!new String(cls.bytes,java.nio.charset.StandardCharsets.ISO_8859_1).contains('farAndBusyGeometryFromRealMesher'))throw new GradleException('Admission fixture marker missing before native')
 } }
}
