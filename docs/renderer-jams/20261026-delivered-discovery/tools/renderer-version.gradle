gradle.beforeProject { p -> if (p.path != ':gui-themes') p.ext.mod_version = '0.0.1-alpha.29-dev.30-renderer.5' }
gradle.projectsEvaluated {
 def root = gradle.rootProject
 root.tasks.register('rendererDiscoveryChecks', JavaExec) {
  dependsOn root.tasks.named('coreChecksClasses')
  classpath = root.sourceSets.coreChecks.runtimeClasspath
  mainClass = 'com.shnewbs.deepprimal.core.lod.DeliveredChunkScanChecks'
  javaLauncher = root.javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
 }
 root.tasks.named('check') { dependsOn 'rendererDiscoveryChecks' }
}
