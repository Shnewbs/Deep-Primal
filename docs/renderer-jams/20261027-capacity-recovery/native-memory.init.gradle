gradle.projectsEvaluated {
    def run = gradle.rootProject.extensions.getByName('neoForge').runs.getByName('server')
    run.jvmArguments.set(run.jvmArguments.get().findAll { !it.startsWith('-Xmx') } + ['-Xmx512m'])
    // The audit's redirected Themes output must be excluded too, so native
    // validation resolves Themes from the exported outer JAR like every module.
    def task = gradle.rootProject.tasks.named('runServer').get()
    def themesOutput = gradle.rootProject.project(':gui-themes').layout.buildDirectory.get().asFile.canonicalPath
    def original = gradle.rootProject.files(new ArrayList(task.classpathProvider.from))
    task.classpathProvider.setFrom(original.filter { f ->
        def path = f.canonicalPath
        !(path == themesOutput || path.startsWith(themesOutput + File.separator))
    })
}



gradle.projectsEvaluated { gradle.rootProject.project(':gui-themes').tasks.configureEach { enabled = false } }

gradle.projectsEvaluated { gradle.rootProject.allprojects { p -> p.tasks.configureEach { t -> if (t.path != ':runServer' && t.name != 'prepareServerRun') t.enabled = false } } }
