plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = mod_version
group = 'tfcmt.tfcitembarrelsandmore'
base.archivesName = 'TFCMaritimeTravelers-1.21.1'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories {
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://maven.theillusivec4.top/' }
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.tterrag.com' }
    maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
    maven { url = 'https://maven.valkyrienskies.org' }
}
neoForge {
    version = neo_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods {
        tfc_item_barrels_and_more { sourceSet sourceSets.main }
    }
}
dependencies {
    implementation files('libs/tfc-4.2.12.jar')
    runtimeOnly 'vazkii.patchouli:Patchouli:1.21.1-92-NEOFORGE'
    compileOnly 'org.valkyrienskies.core:api:1.1.0+2d6eb6ff55'
    compileOnly('maven.modrinth:sodium-dynamic-lights:XI0WLXdn') { transitive = false }
    compileOnly 'mezz.jei:jei-1.21.1-common-api:19.25.0.321'
    compileOnly 'mezz.jei:jei-1.21.1-neoforge-api:19.25.0.321'
    compileOnly 'com.simibubi.create:create-1.21.1:6.0.11-319'
    compileOnly 'top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1:api'
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xmaxerrs', '2000'])
}

// Use only the original assets from the supplied artifact; never include its 1.20.1 bytecode.
tasks.named('processResources', ProcessResources) {
    from(zipTree('upstream/TFCMaritimeTravelers-1.20.1-0.0.4.jar')) { include 'assets/**' }
}

tasks.register('fetchTfc', Exec) {
    commandLine 'python3', 'tools/fetch_dependencies.py'
    inputs.file 'tools/fetch_dependencies.py'
    outputs.file 'libs/tfc-4.2.12.jar'
}
tasks.named('compileJava') { dependsOn 'fetchTfc' }

// The preserved 1.20.1 data tree is never used for the port's datapack.
sourceSets.main.resources { exclude 'assets/**'; exclude 'data/**' }
tasks.named('processResources', ProcessResources) { from 'src/ported/resources' }
sourceSets.main.java.exclude 'com/example/**'
