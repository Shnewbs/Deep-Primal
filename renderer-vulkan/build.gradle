plugins { id 'java-library' }
group = 'com.shnewbs.deepprimal'
version = rootProject.mod_version
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
base.archivesName = 'DeepPrimal-Vulkan'
repositories { mavenCentral() }
def vulkanPlatform = rootProject.findProperty("vulkanPlatform") ?: "universal"
if (!(vulkanPlatform in ["universal","linux","windows","macos","macos-arm64"])) throw new GradleException("Unknown Vulkan platform: $vulkanPlatform")
def nativePlatforms = vulkanPlatform == "universal" ? ["linux","windows","macos","macos-arm64"] : [vulkanPlatform]
configurations { bundled { transitive = false }; compileOnly.extendsFrom(bundled) }
dependencies {
    implementation project(':graphics-settings')
    compileOnly files(rootProject.minecraftClasspath)
    bundled 'org.lwjgl:lwjgl-vulkan:3.4.1'
    bundled 'org.lwjgl:lwjgl-shaderc:3.4.1'
    bundled 'org.lwjgl:lwjgl-vma:3.4.1'
    for (module in ['lwjgl-shaderc', 'lwjgl-vma']) {
        for (platform in nativePlatforms) {
            bundled "org.lwjgl:${module}:3.4.1:natives-${platform}"
        }
    }
    for (platform in nativePlatforms.findAll { it.startsWith('macos') }) bundled "org.lwjgl:lwjgl-vulkan:3.4.1:natives-${platform}"
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
processResources {
    inputs.property 'mod_version', rootProject.mod_version
    filesMatching('META-INF/neoforge.mods.toml') { expand(mod_version: rootProject.mod_version) }
}
tasks.named('jar') {
    if(vulkanPlatform != 'universal') archiveClassifier.set(vulkanPlatform)
    exclude '**/.*'
    from({ configurations.bundled.collect { zipTree(it) } }) {
        exclude 'META-INF/MANIFEST.MF', 'META-INF/versions/**', 'module-info.class', 'META-INF/INDEX.LIST'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from('LICENSE') { into 'META-INF/licenses/vulkanmod' }
    from('COPYING') { into 'META-INF/licenses/vulkanmod' }
    from('UPSTREAM.json') { into 'META-INF/licenses/vulkanmod' }
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.named('compileJava') { dependsOn rootProject.tasks.named('createMinecraftArtifacts') }

